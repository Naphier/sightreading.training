env SR_FEEDBACK_ENABLED;
env SR_FEEDBACK_TOKEN_FILE;
env SR_FEEDBACK_TOKEN;
env SR_FEEDBACK_THRESHOLD;
env SR_FEEDBACK_OWNER;
env SR_FEEDBACK_REPO;
worker_processes ${{NUM_WORKERS}};
error_log stderr notice;
daemon off;
pid logs/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  lua_package_path "$prefix/?.lua;$prefix/?/init.lua;;";

  init_by_lua_block {
    require "lpeg"
    require "socket"
    require "ltn12"
    require "mime"
  }

  lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  lua_ssl_verify_depth 5;
  limit_req_zone $binary_remote_addr zone=feedback:10m rate=30r/m;
  resolver 127.0.0.11 valid=30s ipv6=off;

  init_worker_by_lua_block {
    if ngx.worker.id() == 0 and os.getenv("SR_FEEDBACK_ENABLED") == "1" then
      ngx.timer.every(60, function(premature)
        if premature then return end
        local ok = pcall(function() require("helpers.feedback").reconcile() end)
        if not ok then ngx.log(ngx.ERR, "Feedback reconciliation failed") end
      end)
    end
  }

  server {
    listen ${{PORT}};
    lua_code_cache ${{CODE_CACHE}};

    add_header Cross-Origin-Embedder-Policy require-corp;
    add_header Cross-Origin-Opener-Policy same-origin;

    location ^~ /feedback {
      limit_req zone=feedback burst=10 nodelay;
      limit_req_status 429;
      default_type text/html;
      content_by_lua 'require("lapis").serve("app")';
    }

    location / {
      default_type text/html;
      content_by_lua '
        require("lapis").serve("app")
      ';
    }

    location /static/ {
      if ($request_filename ~* \.es6$|\.scss$) {
        return 403;
      }

      access_log off;
      gzip on;
      gzip_types application/x-javascript text/css image/svg+xml;

      alias static/;
    }

    location /sw.js {
      alias static/service_worker.js;
    }

    location /favicon.ico {
      alias static/favicon.ico;
    }
  }
}
